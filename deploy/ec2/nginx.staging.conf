worker_processes 1;

events { worker_connections 1024; }

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

  # Docker DNS resolver for dynamic container IP resolution
  resolver 127.0.0.11 valid=10s;

  server {
    listen 80;
    server_name likelee.rustcameroon.com;

    # Health check endpoint (returns 200 OK directly, no upstream dependency)
    location = /healthz {
      add_header Content-Type text/plain;
      return 200 "ok\n";
    }

    location /api/ {
      set $api_backend http://server:8787;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass $api_backend;
    }

    location /webhooks/ {
      set $api_backend http://server:8787;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass $api_backend;
    }

    location ^~ /assets/ {
      set $ui_backend http://ui:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      proxy_pass $ui_backend;
    }

    location ^~ /media/ {
      set $ui_backend http://ui:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      proxy_pass $ui_backend;
    }

    location / {
      set $ui_backend http://ui:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
      proxy_pass $ui_backend;
    }
  }
}
