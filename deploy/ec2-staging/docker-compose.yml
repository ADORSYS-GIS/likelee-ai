services:
  gateway:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - ui
      - server
    networks:
      - likelee-staging

  server:
    build:
      context: ../../
      dockerfile: likelee-server/Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      RUST_LOG: debug
      APP_ENV: staging
    expose:
      - "8787"
    networks:
      - likelee-staging

  ui:
    build:
      context: ../../
      dockerfile: likelee-ui/Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    restart: unless-stopped
    expose:
      - "8080"
    networks:
      - likelee-staging

networks:
  likelee-staging:
    driver: bridge
