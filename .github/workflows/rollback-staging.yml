name: Manual Rollback Staging

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to rollback to. Leave empty to use previous recorded tag."
        required: false
        default: ""

permissions:
  contents: read

env:
  REMOTE_DIR: /opt/likelee-staging/deploy/ec2

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - name: Compute lowercase repository path
        shell: bash
        run: |
          echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Trigger rollback on Staging EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_EC2_HOST }}
          username: ${{ secrets.STAGING_EC2_USER }}
          key: ${{ secrets.STAGING_EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ${{ env.REMOTE_DIR }}
            export REGISTRY_IMAGE_SERVER="ghcr.io/${{ env.REPO_LOWER }}/likelee-server"
            export REGISTRY_IMAGE_UI="ghcr.io/${{ env.REPO_LOWER }}/likelee-ui"
            export COMPOSE_PROJECT_NAME=likelee-staging
            chmod +x scripts/rollback.sh || true
            if [ -n "${{ github.event.inputs.tag }}" ]; then
              ./scripts/rollback.sh "staging-${{ github.event.inputs.tag }}"
            else
              ./scripts/rollback.sh
            fi
            echo "Staging rollback requested"
