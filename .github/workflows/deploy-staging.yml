name: Deploy to Staging EC2

on:
  push:
    branches: [develop]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}
  SERVER_IMAGE_NAME: likelee-server
  UI_IMAGE_NAME: likelee-ui
  REMOTE_DIR: /opt/likelee-staging/deploy/ec2

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute lowercase repository path
        shell: bash
        run: echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push likelee-server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: likelee-server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/likelee-server:staging-${{ env.IMAGE_TAG }}
            ghcr.io/${{ env.REPO_LOWER }}/likelee-server:staging-latest
          cache-from: type=registry,ref=ghcr.io/${{ env.REPO_LOWER }}/likelee-server:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ env.REPO_LOWER }}/likelee-server:buildcache,mode=max

      - name: Build and push likelee-ui
        uses: docker/build-push-action@v6
        with:
          context: .
          file: likelee-ui/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/likelee-ui:staging-${{ env.IMAGE_TAG }}
            ghcr.io/${{ env.REPO_LOWER }}/likelee-ui:staging-latest
          cache-from: type=registry,ref=ghcr.io/${{ env.REPO_LOWER }}/likelee-ui:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ env.REPO_LOWER }}/likelee-ui:buildcache,mode=max
          build-args: |
            VITE_SUPABASE_URL=${{ secrets.STAGING_VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.STAGING_VITE_SUPABASE_ANON_KEY }}
            VITE_API_BASE_URL=/api

  deploy:
    name: Deploy on Staging EC2 via SSH
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Compute lowercase repository path
        shell: bash
        run: |
          echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Deploy and verify on Staging EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_EC2_HOST }}
          username: ${{ secrets.STAGING_EC2_USER }}
          key: ${{ secrets.STAGING_EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            sudo -n bash -lc 'bash -s' <<'REMOTE_SCRIPT'
            set -euo pipefail
            echo "Running STAGING deployment as root (user: $(whoami))"
            
            DEPLOY_DIR="${{ env.REMOTE_DIR }}"
            TMP_PULL="/tmp/likelee-staging-pull"
            
            mkdir -p "$(dirname "${DEPLOY_DIR}")"
            mkdir -p "${DEPLOY_DIR}"

            # Preserve instance-specific files
            if [ -f "${DEPLOY_DIR}/.env" ]; then cp "${DEPLOY_DIR}/.env" /tmp/.env.staging.backup || true; fi

            # Pull deploy files from GitHub (avoids SCP SSH key issues)
            rm -rf "${TMP_PULL}"
            mkdir -p "${TMP_PULL}"
            curl -fsSL \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/tarball/${{ github.sha }}" \
              | tar xz -C "${TMP_PULL}" --strip-components=1 --wildcards "*/deploy/ec2/*" "*/deploy/ec2-staging/*"

            # Refresh managed assets (preserve only .env)
            if command -v rsync >/dev/null 2>&1; then
              rsync -a --delete \
                --exclude '.env' \
                "${TMP_PULL}/deploy/ec2/" "${DEPLOY_DIR}"/
              # Also sync staging-specific overrides if they exist
              if [ -d "${TMP_PULL}/deploy/ec2-staging" ]; then
                rsync -a --ignore-missing-args \
                  "${TMP_PULL}/deploy/ec2-staging/" "${DEPLOY_DIR}"/
              fi
            else
              rm -rf "${DEPLOY_DIR}"/*
              cp -a "${TMP_PULL}/deploy/ec2/." "${DEPLOY_DIR}"/
            fi

            # Restore preserved files
            if [ -f /tmp/.env.staging.backup ]; then mv -f /tmp/.env.staging.backup "${DEPLOY_DIR}/.env"; fi

            # Cleanup temp pull
            rm -rf "${TMP_PULL}"

            cd "${DEPLOY_DIR}"
            echo "CWD: $(pwd)"

            # Load variables from .env if present
            if [ -f .env ]; then set -a; . ./.env; set +a; fi
            PROJECT_NAME="likelee-staging"
            
            # Always use HTTP-only mode (behind ALB)
            cp -f nginx.http.conf nginx.conf || true

            # Optional GHCR login
            GHCR_USER="${{ secrets.STAGING_GHCR_USER }}"
            GHCR_TOKEN="${{ secrets.STAGING_GHCR_TOKEN }}"
            if [ -n "${GHCR_USER}" ] && [ -n "${GHCR_TOKEN}" ]; then
              echo "Logging into GHCR as ${GHCR_USER}"
              echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin || true
            fi

            export REGISTRY_IMAGE_SERVER="ghcr.io/${{ env.REPO_LOWER }}/likelee-server"
            export REGISTRY_IMAGE_UI="ghcr.io/${{ env.REPO_LOWER }}/likelee-ui"
            export IMAGE_TAG="staging-${{ env.IMAGE_TAG }}"
            
            # Cleanup old containers
            docker rm -f likelee-staging-server likelee-staging-ui likelee-staging-gateway >/dev/null 2>&1 || true
            chmod +x scripts/update-images.sh scripts/rollback.sh || true

            # Use staging project name for compose
            export COMPOSE_PROJECT_NAME=likelee-staging
            
            if ! docker compose -p likelee-staging --env-file ./.env -f docker-compose.yml -f docker-compose.prod.yml up -d; then
              echo "Staging deployment failed" >&2
              exit 1
            fi

            sleep 10
            set +e
            curl -sS --max-time 15 http://localhost/ >/dev/null
            WEB_OK=$?
            API_OK=1
            for i in 1 2 3 4 5 6; do
              curl -sS --max-time 15 http://localhost/api/health >/dev/null && { API_OK=0; break; }
              sleep 5
            done
            set -e

            if [ "$WEB_OK" -ne 0 ] || [ "$API_OK" -ne 0 ]; then
              echo "Staging health checks failed (WEB=$WEB_OK API=$API_OK)" >&2
              exit 1
            fi

            echo "Staging deployment succeeded for tag staging-${{ env.IMAGE_TAG }}"
            REMOTE_SCRIPT
